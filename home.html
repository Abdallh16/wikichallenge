<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>WikiChallenge | الرئيسية</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at top,#253451 0,#101827 48%,#090e18 100%);color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:100%;max-width:440px}.brand{text-align:center;margin-bottom:28px}.logo{width:76px;height:76px;margin:0 auto 16px;border-radius:24px;background:linear-gradient(135deg,#60a5fa,#2563eb);display:grid;place-items:center;font-size:38px;box-shadow:0 12px 36px #2563eb55}.brand h1{margin:0;font-size:29px;letter-spacing:.2px}.brand p{margin:9px 0 0;color:#aab8cc;line-height:1.7}.links{display:grid;gap:14px}.item{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;padding:18px;border:1px solid #ffffff1a;border-radius:20px;background:#ffffff0b;transition:transform .15s,background .15s}.item:active{transform:scale(.985)}.item:hover{background:#ffffff12}.emoji{width:54px;height:54px;flex-shrink:0;border-radius:16px;display:grid;place-items:center;font-size:27px}.game .emoji{background:#2563eb35}.wiki .emoji{background:#16a34a30}.copy{flex:1}.copy strong{display:block;font-size:18px;margin-bottom:5px}.copy span{display:block;color:#b8c4d6;font-size:13px;line-height:1.6}.arrow{font-size:22px;color:#94a3b8}.foot{text-align:center;color:#77869c;font-size:12px;margin-top:24px}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div class="logo">🧠</div>
    <h1>WikiChallenge</h1>
    <p>اختبر معلوماتك واكتشف حاجة جديدة كل يوم</p>
  </header>
  <nav class="links" aria-label="التطبيقات">
    <a class="item game" href="https://abdallh16.github.io/wikichallenge/" target="_blank" rel="noopener">
      <div class="emoji">🎮</div><div class="copy"><strong>ابدأ اللعبة</strong><span>جاوب على الأسئلة واجمع النقاط</span></div><div class="arrow">←</div>
    </a>
    <a class="item wiki" href="https://www.wikipedia.org/" target="_blank" rel="noopener">
      <div class="emoji">📚</div><div class="copy"><strong>افتح ويكيبيديا</strong><span>ابحث واقرأ عن أي موضوع يهمك</span></div><div class="arrow">←</div>
    </a>
  </nav>
  <div class="foot">اختار وجهتك وابدأ الاستكشاف ✨</div>
</main>
</body>
</html>
