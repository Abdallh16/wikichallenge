<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#101827">
<title>WikiChallenge</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#182337;--panel2:#202f47;--text:#f4f7fb;--muted:#aab8cc;--accent:#63e6be;--wrong:#ff7b86}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#203a55 0,#101827 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:18px}
.app{width:100%;max-width:560px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:20px;letter-spacing:.2px}.pill{background:#26364d;padding:8px 12px;border-radius:99px;color:var(--accent);font-weight:700;font-size:14px}
.card{background:rgba(24,35,55,.96);border:1px solid #34435a;border-radius:24px;padding:22px;box-shadow:0 18px 50px #0003}
.eyebrow{color:var(--accent);font-weight:800;font-size:13px;margin-bottom:12px}.hero{text-align:center;padding:28px 8px 20px}.emoji{font-size:54px}.hero h1{font-size:30px;margin:12px 0 8px}.hero p,.sub{color:var(--muted);line-height:1.7;margin:0 0 20px}
.btn{border:0;border-radius:14px;padding:14px 16px;width:100%;font:inherit;font-weight:800;font-size:16px;cursor:pointer;transition:transform .12s,opacity .12s}.btn:active{transform:scale(.985)}.primary{background:var(--accent);color:#10251f}.secondary{background:var(--panel2);color:var(--text);border:1px solid #3a4b64}.options{display:grid;gap:10px;margin:20px 0}.option{text-align:right;background:#202f47;color:var(--text);border:1px solid #3a4b64;border-radius:14px;padding:14px;font:inherit;cursor:pointer;line-height:1.5}.option:disabled{cursor:default;opacity:1}.option.correct{border-color:var(--accent);background:#174538}.option.incorrect{border-color:var(--wrong);background:#4b2732}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 0 10px}.track{height:7px;background:#2a3950;border-radius:99px;overflow:hidden}.bar{height:100%;width:100%;background:var(--accent);transition:width .25s linear}.question{font-size:22px;line-height:1.5;margin:10px 0 0}.feedback{min-height:26px;font-weight:700;margin:6px 0 12px}.hidden{display:none!important}.result{text-align:center;padding:18px 4px}.result .score{font-size:52px;font-weight:900;color:var(--accent);margin:8px}.small{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div class="brand">🧠 WikiChallenge</div><div class="pill">تحدّي معلوماتك</div></div>
  <section id="start" class="card">
    <div class="hero">
      <div class="emoji">🌍</div>
      <h1>جاهز للتحدّي؟</h1>
      <p>اختبر معلوماتك في العلوم والتاريخ والجغرافيا والتكنولوجيا. جاوب صح واجمع أكبر عدد من النقاط!</p>
      <button class="btn primary" id="startBtn">ابدأ اللعب 🚀</button>
    </div>
  </section>
  <section id="game" class="card hidden">
    <div class="eyebrow" id="category">سؤال معلومات عامة</div>
    <div class="track"><div class="bar" id="timeBar"></div></div>
    <div class="meta"><span id="progress">السؤال 1 من 10</span><span>⏱️ <b id="time">15</b> ثانية</span><span>⭐ <b id="score">0</b></span></div>
    <h2 class="question" id="question"></h2>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <button class="btn secondary hidden" id="nextBtn">السؤال التالي ←</button>
  </section>
  <section id="result" class="card hidden">
    <div class="result">
      <div class="emoji">🏆</div><h1>خلصت التحدّي!</h1>
      <div class="score" id="finalScore">0/100</div>
      <p class="sub" id="resultText"></p>
      <button class="btn primary" id="againBtn">العب تاني 🔄</button>
    </div>
  </section>
  <div class="small">WikiChallenge • لعبة تجريبية مستقلة</div>
</main>
<script>
const questions = [
 {c:"جغرافيا",q:"ما أكبر كوكب في المجموعة الشمسية؟",a:["الأرض","المشتري","زحل","المريخ"],correct:1,why:"المشتري هو أكبر كواكب المجموعة الشمسية."},
 {c:"علوم",q:"ما الغاز الذي تمتصه النباتات غالبًا من الهواء أثناء البناء الضوئي؟",a:["الأكسجين","النيتروجين","ثاني أكسيد الكربون","الهيدروجين"],correct:2,why:"تستخدم النباتات ثاني أكسيد الكربون مع الماء والضوء."},
 {c:"تاريخ",q:"أين تقع أهرامات الجيزة؟",a:["مصر","العراق","المغرب","اليونان"],correct:0,why:"تقع أهرامات الجيزة في مصر قرب القاهرة."},
 {c:"فضاء",q:"ما النجم الأقرب إلى الأرض؟",a:["الشعرى اليمانية","الشمس","نجم القطب","منكب الجوزاء"],correct:1,why:"الشمس هي أقرب نجم إلى الأرض."},
 {c:"تكنولوجيا",q:"ماذا تعني الأحرف WWW؟",a:["World Wide Web","Wide World Window","Web World Wire","World Web Work"],correct:0,why:"هي اختصار World Wide Web."},
 {c:"جغرافيا",q:"ما المحيط الأكبر على الأرض؟",a:["الأطلسي","الهندي","المتجمد الشمالي","الهادئ"],correct:3,why:"المحيط الهادئ هو الأكبر مساحة."},
 {c:"علوم",q:"كم عدد أضلاع الشكل السداسي؟",a:["خمسة","ستة","سبعة","ثمانية"],correct:1,why:"الشكل السداسي له ستة أضلاع."},
 {c:"أدب",q:"من كتب مسرحية روميو وجولييت؟",a:["تشارلز ديكنز","ويليام شكسبير","فيكتور هوغو","مارك توين"],correct:1,why:"كتبها الكاتب المسرحي الإنجليزي ويليام شكسبير."},
 {c:"جسم الإنسان",q:"أي عضو يضخ الدم إلى أنحاء الجسم؟",a:["الرئة","الكبد","القلب","المعدة"],correct:2,why:"القلب يضخ الدم عبر الدورة الدموية."},
 {c:"رياضيات",q:"ما ناتج 9 × 8؟",a:["63","72","81","64"],correct:1,why:"تسعة في ثمانية تساوي 72."}
];
let order=[],index=0,score=0,locked=false,timer=null,remaining=15;
const $=id=>document.getElementById(id);
function show(id){["start","game","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function startGame(){clearInterval(timer);order=[...questions].sort(()=>Math.random()-.5);index=0;score=0;show("game");renderQuestion()}
function renderQuestion(){locked=false;remaining=15;const item=order[index];$("category").textContent="📚 "+item.c;$("question").textContent=item.q;$("progress").textContent=`السؤال ${index+1} من ${order.length}`;$("score").textContent=score;$("time").textContent=remaining;$("timeBar").style.width="100%";$("feedback").textContent="";$("nextBtn").classList.add("hidden");$("options").innerHTML="";
 item.a.forEach((answer,i)=>{const b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(0x0661+i)+". "+answer;b.onclick=()=>choose(i);$("options").appendChild(b)});clearInterval(timer);timer=setInterval(()=>{remaining--;$("time").textContent=remaining;$("timeBar").style.width=(remaining/15*100)+"%";if(remaining<=0){clearInterval(timer);if(!locked)choose(-1)}},1000)}
function choose(choice){if(locked)return;locked=true;clearInterval(timer);const item=order[index];[...$("options").children].forEach((b,i)=>{b.disabled=true;if(i===item.correct)b.classList.add("correct");if(i===choice&&choice!==item.correct)b.classList.add("incorrect")});if(choice===item.correct){score+=10;$("feedback").textContent="إجابة صحيحة! +10 نقاط 🎉";$("feedback").style.color="var(--accent)"}else{$("feedback").textContent=choice===-1?"انتهى الوقت! ⏰ "+item.why:"مش هي دي 😅 "+item.why;$("feedback").style.color="var(--wrong)"}$("score").textContent=score;$("nextBtn").textContent=index===order.length-1?"عرض النتيجة 🏆":"السؤال التالي ←";$("nextBtn").classList.remove("hidden")}
function next(){if(index<order.length-1){index++;renderQuestion()}else{clearInterval(timer);show("result");$("finalScore").textContent=score+"/100";$("resultText").textContent=score>=80?"ممتاز! معلوماتك قوية جدًا 🔥":score>=50?"شغل حلو! جرّب مرة تانية لتحسّن نتيجتك 💪":"بداية كويسة! العب تاني وشوف هتجيب كام 😎"}}
$("startBtn").onclick=startGame;$("nextBtn").onclick=next;$("againBtn").onclick=startGame;
</script>
</body>
</html>
